<script>(function(){
const C=window.MSI_CONFIG||{},FB=!!C.apiKey;
const em=u=>u.toLowerCase()+'@msi-sms.app';
const subs=new Set(),watchers=new Set();
const MSI={mode:FB?'firebase':'local',me:undefined,flash:'',
 listen(cb){subs.add(cb);if(MSI.me!==undefined)cb(MSI.me);return()=>subs.delete(cb)}};
let busy=false;
const emit=p=>{if(busy)return;MSI.me=p;[...subs].forEach(f=>{try{f(p)}catch(e){console.error("MSI listener error:",e)}})};
MSI.chk=d=>{if(!/^[a-z0-9_.-]{3,30}$/i.test(d.username||''))throw new Error('Username must be 3–30 characters: letters, numbers, . _ -');if((d.password||'').length<8)throw new Error('Password must be at least 8 characters.')};
const prof=(d,role,status,x)=>Object.assign({username:d.username.toLowerCase(),name:d.name||'',email:d.email||'',whatsapp:d.whatsapp||'',country:d.country||'',role,status,createdAt:Date.now()},x||{});
const flt=(r,f)=>r.filter(u=>u.role===f.role&&(!f.agentId||u.agentId===f.agentId)).sort((a,b)=>b.createdAt-a.createdAt);
if(!FB){
 const L={get u(){try{return JSON.parse(localStorage.msi_users||'[]')}catch(e){return[]}},set u(v){localStorage.msi_users=JSON.stringify(v)}};
 const h=async s=>{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('msi:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}return s};
 const pub=u=>{if(!u)return null;const r=Object.assign({},u);delete r.pw;return r};
 const me=()=>pub(L.u.find(u=>u.uid===localStorage.msi_sess));
 const push=()=>{emit(me()||null);watchers.forEach(w=>w())};
 addEventListener('storage',push);
 const add=async(d,role,status,x)=>{MSI.chk(d);const a=L.u;if(a.some(u=>u.username===d.username.toLowerCase()))throw new Error('That username is already taken.');const n=Object.assign(prof(d,role,status,x),{uid:'u'+Date.now()+Math.random().toString(36).slice(2,7),pw:await h(d.password)});a.push(n);L.u=a;return n};
 const mod=(uid,f)=>{const a=L.u,i=a.findIndex(u=>u.uid===uid);if(i<0)throw new Error('User not found.');Object.assign(a[i],f);L.u=a;push()};
 Object.assign(MSI,{
  async login(un,pw){const u=L.u.find(x=>x.username===un.toLowerCase());if(!u||u.pw!==await h(pw))throw new Error('Wrong username or password.');localStorage.msi_sess=u.uid;push()},
  async register(d){await add(d,'agent','pending');push()},
  async createUser(d){await add(d,d.role,d.status||'active',Object.assign(d.role==='client'?{agentId:d.agentId}:{},d.extra||{}));push()},
  async logout(){delete localStorage.msi_sess;push()},
  watch(f,cb){const w=()=>cb(flt(L.u.map(pub),f));watchers.add(w);w();return()=>watchers.delete(w)},
  async setStatus(uid,s){mod(uid,{status:s})},
  async updateProfile(uid,f){mod(uid,f)},
  async changePassword(c,n){const u=L.u.find(x=>x.uid===localStorage.msi_sess);if(u.pw!==await h(c))throw new Error('Current password is wrong.');mod(u.uid,{pw:await h(n)})},
  async adminExists(){return L.u.some(u=>u.role==='admin')},
  async bootstrapAdmin(d){if(await MSI.adminExists())throw new Error('An admin already exists.');const n=await add(d,'admin','active');localStorage.msi_sess=n.uid;push()}
 });
 setTimeout(push,0);
}else{
 let A,Au,Fs,auth,db,app2,unMe=()=>{};
 const ready=(async()=>{const B='https://www.gstatic.com/firebasejs/10.14.1/';[A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(C);auth=Au.getAuth(app);db=Fs.getFirestore(app);
  Au.onAuthStateChanged(auth,u=>{unMe();if(!u){emit(null);return}unMe=Fs.onSnapshot(Fs.doc(db,'users',u.uid),s=>{if(s.exists())emit(Object.assign({uid:u.uid},s.data()))},()=>emit(null))})})();
 const M={'auth/invalid-credential':'Wrong username or password.','auth/user-not-found':'Wrong username or password.','auth/wrong-password':'Wrong username or password.','auth/email-already-in-use':'That username is already taken.','auth/weak-password':'Password is too weak.','auth/too-many-requests':'Too many attempts. Try again later.','auth/network-request-failed':'Network error. Check your connection.','permission-denied':'Permission denied by the database rules.'};
 const fe=e=>new Error(M[e.code]||e.message||'Something went wrong.');
 const udoc=id=>Fs.doc(db,'users',id);
 Object.assign(MSI,{
  async login(un,pw){await ready;try{await Au.signInWithEmailAndPassword(auth,em(un),pw)}catch(e){throw fe(e)}},
  async register(d){MSI.chk(d);await ready;busy=true;try{const c=await Au.createUserWithEmailAndPassword(auth,em(d.username),d.password);await Fs.setDoc(udoc(c.user.uid),prof(d,'agent','pending'))}catch(e){try{await Au.signOut(auth)}catch(_){}busy=false;emit(null);throw fe(e)}try{await Au.signOut(auth)}catch(_){}busy=false;emit(null)},
  async createUser(d){MSI.chk(d);await ready;app2=app2||A.initializeApp(C,'sec');const a2=Au.getAuth(app2);
   try{const c=await Au.createUserWithEmailAndPassword(a2,em(d.username),d.password);await Fs.setDoc(udoc(c.user.uid),prof(d,d.role,d.status||'active',Object.assign(d.role==='client'?{agentId:d.agentId}:{},d.extra||{})));await Au.signOut(a2)}catch(e){try{await Au.signOut(a2)}catch(_){}throw fe(e)}},
  async logout(){await ready;await Au.signOut(auth)},
  watch(f,cb){let un=()=>{};ready.then(()=>{const w=[Fs.where('role','==',f.role)];if(f.agentId)w.push(Fs.where('agentId','==',f.agentId));un=Fs.onSnapshot(Fs.query.apply(null,[Fs.collection(db,'users')].concat(w)),s=>cb(flt(s.docs.map(x=>Object.assign({uid:x.id},x.data())),f)),()=>cb([]))});return()=>un()},
  async setStatus(uid,s){await ready;try{await Fs.updateDoc(udoc(uid),{status:s})}catch(e){throw fe(e)}},
  async updateProfile(uid,f){await ready;try{await Fs.updateDoc(udoc(uid),f)}catch(e){throw fe(e)}},
  async changePassword(c,n){await ready;try{const u=auth.currentUser;await Au.reauthenticateWithCredential(u,Au.EmailAuthProvider.credential(u.email,c));await Au.updatePassword(u,n)}catch(e){throw fe(e)}},
  async adminExists(){await ready;return(await Fs.getDoc(Fs.doc(db,'meta','admin'))).exists()},
  async bootstrapAdmin(d){MSI.chk(d);await ready;try{const c=await Au.createUserWithEmailAndPassword(auth,em(d.username),d.password),b=Fs.writeBatch(db);b.set(Fs.doc(db,'meta','admin'),{uid:c.user.uid,at:Date.now()});b.set(udoc(c.user.uid),prof(d,'admin','active'));await b.commit()}catch(e){throw fe(e)}}
 });
}
if(!FB)addEventListener('DOMContentLoaded',()=>{const d=document.createElement('div');d.textContent='DEMO MODE: data stays in this browser. Add Firebase config for real-time. (tap to hide)';d.style.cssText='position:fixed;left:8px;bottom:8px;z-index:9999;background:#b8860b;color:#fff;font:12px system-ui;padding:6px 10px;border-radius:10px;max-width:70vw;cursor:pointer;opacity:.92';d.onclick=()=>d.remove();document.body.appendChild(d)});
window.MSI=MSI;
})();
</script>

MSI.listen(p=>{
 if(!p){show('login');return}
 if(p.status==='pending'){fl('Your application is pending admin approval. You can sign in once it is approved.');return}
 if(p.status==='suspended'||p.status==='blocked'){fl('Your account is '+p.status+'. Please contact support.');return}

 show(p.role==='client'?'client':'dash')});

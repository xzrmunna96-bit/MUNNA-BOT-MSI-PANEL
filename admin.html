<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSI SMS – Admin Panel</title>
<style>
:root{--bg:#f4f5f9;--surface:#fff;--inner:#f0f1f6;--text:#14161f;--muted:#667085;--line:#dfe2ec;--gold:#b8860b;--blue:#2f6fed;--green:#12a971;--red:#e5484d;--grad:linear-gradient(135deg,#7c3aed,#f97316);--sel:#ece7ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d16;--surface:#10131f;--inner:#151927;--text:#f2f3f8;--muted:#9aa1b5;--line:#252a3b;--gold:#d4a73a;--blue:#7aa2ff;--green:#3ddc97;--sel:#241a52}}
:root[data-theme="dark"]{--bg:#0b0d16;--surface:#10131f;--inner:#151927;--text:#f2f3f8;--muted:#9aa1b5;--line:#252a3b;--gold:#d4a73a;--blue:#7aa2ff;--green:#3ddc97;--sel:#241a52}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;position:relative;flex:none}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:1.05rem}.ttl span{color:var(--muted);font-size:.85rem}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.hero{border-left:4px solid var(--gold)}
.eyebrow{color:var(--gold);font-weight:700;font-size:.85rem;letter-spacing:.03em;text-transform:uppercase}
h1{font-size:2.2rem;margin:4px 0 6px}h2{font-size:1.4rem;margin:2px 0 14px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1;min-width:140px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.spin::before{content:"⟳ ";display:inline-block;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--inner);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat small{color:var(--blue);font-size:.95rem}.stat strong{display:block;font-size:2rem;margin:2px 0}.stat i{color:var(--green);font-style:normal}
.news{display:flex;gap:12px;padding:16px;background:var(--inner);border:1px solid var(--line);border-radius:16px;margin-top:12px}
.news .ic{width:40px;height:40px;border-radius:12px;background:rgba(61,220,151,.14);display:grid;place-items:center;flex:none}
.news b{display:block}.news p{margin:4px 0;color:var(--muted);font-size:.92rem}
table{width:100%;border-collapse:collapse}th{color:var(--muted);font-size:.8rem;text-align:left;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:14px 8px;border-bottom:1px solid var(--line)}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.8rem;color:var(--muted)}
.bar div{width:100%;max-width:42px;border-radius:8px 8px 0 0;background:var(--grad);min-height:4px}
.bar em{font-style:normal;color:var(--text);font-size:.8rem;margin-bottom:4px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--grad);color:#fff;font-size:22px;box-shadow:0 6px 20px rgba(124,58,237,.4);z-index:9}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.side{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-100%);transition:.25s;z-index:21;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 20px}
body.open .ov{opacity:1;pointer-events:auto}body.open .side{transform:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand .logo{flex:none;width:40px;height:40px}.logo img{width:100%;height:100%;display:block;object-fit:contain}
.brand div{flex:1}.brand b{display:block}.brand span{color:var(--muted);font-size:.85rem}
.nav{width:100%;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;display:flex;align-items:center;gap:12px;font-size:1.02rem}
.nav .ch{margin-left:auto;display:grid;transition:.2s}
.nav.act{background:var(--sel);border-left:3px solid var(--gold)}
.nav.opn{background:var(--sel)}.nav.opn .ch{transform:rotate(180deg)}
.sub{display:none;margin:0 0 8px 28px}
.sub.show{display:block}.sub a{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:6px;border-radius:12px;background:var(--inner);color:var(--text);text-decoration:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
u{display:contents}
.top{gap:6px}.top .ib{width:36px;height:36px;border-radius:10px}.top .ttl b{font-size:.95rem;line-height:1.2}
.pg{display:none}.pg.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.g{background:#228a5c;border-color:#2fa36f;color:#fff;box-shadow:0 8px 22px rgba(124,58,237,.22)}
.btn.nf{flex:none;min-width:0}.btn.wide{display:flex;width:100%}
.rf.spin svg{animation:r .8s linear infinite}.btn.rf.spin::before{content:none}
.pg label{display:block;font-weight:600;margin:0 0 8px;font-size:1.05rem}
.pg select,.pg input:not([type=checkbox]){width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 16px;font:inherit;outline:none}
.pg select:focus,.pg input:focus{border-color:var(--blue)}
.f{margin-bottom:16px}
.sel{position:relative}.sel select{appearance:none;padding-right:44px}
.sel::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border:solid var(--text);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.dt{position:relative}.dt input{padding-right:56px}
.dt button{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center}
.hd{display:grid;grid-template-columns:minmax(90px,.4fr) 1fr;gap:16px;align-items:start;margin-bottom:20px}.hd h2{margin:2px 0 0}.acts{display:grid;gap:10px}
.card.big{border-radius:28px}.card.big h1{font-size:2.4rem;line-height:1.15}
.msg{color:var(--muted);font-size:.92rem;min-height:1.2em;margin-top:10px}
.opt{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;border:1.5px solid var(--gold);background:rgba(212,167,58,.08);box-shadow:0 0 0 4px rgba(212,167,58,.12)}
.oi{width:44px;height:44px;border-radius:12px;background:var(--inner);display:grid;place-items:center;flex:none}.opt b{font-size:1.15rem}.opt p{margin:2px 0 0;color:var(--muted)}
.kv{background:var(--inner);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.kv small{color:var(--muted);display:block}.kv b{font-size:1.4rem}
.sn{margin:0;padding-left:22px}.sn li{margin-bottom:10px}
.tl{display:grid;grid-template-columns:1.3fr 1fr;padding:12px 10px;margin-top:22px;color:var(--muted);font-size:.85rem;text-transform:uppercase;border-bottom:1px solid var(--line);position:relative}
.tl::after{content:"";position:absolute;left:0;bottom:-3px;width:49%;height:4px;background:var(--muted);opacity:.5}
.empty{margin-top:4px;border:1.5px dashed var(--line);border-radius:16px;padding:34px 10px;text-align:center;color:var(--muted)}.empty svg{width:28px;height:28px}.empty p{margin:18px 0 0;font-size:1.15rem}
.pgn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}.pgn .btn{padding:10px 16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.pg .chip{display:flex;align-items:center;gap:12px;margin:0;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:1rem;cursor:pointer}
.chip input{appearance:none;width:22px;height:22px;margin:0;border-radius:6px;border:1.5px solid var(--muted);background:#fff;display:grid;place-items:center}
.chip input:checked{background:#228a5c;border-color:#228a5c}.chip input:checked::after{content:"✓";color:#fff;font-size:14px;line-height:1}
.tw{overflow-x:auto;margin-top:24px;border-bottom:2px solid var(--blue)}.tw table{min-width:560px}.tw th{white-space:nowrap}
.gt{display:flex;justify-content:space-between;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}.gt b{color:var(--blue);text-transform:uppercase}.gt small{display:block;color:var(--muted);text-transform:uppercase;font-size:.8rem}
.sub a.act{background:var(--sel)}
.ck{appearance:none;width:22px;height:22px;margin:0;border-radius:6px;border:1.5px solid var(--muted);background:#fff;display:grid;place-items:center;cursor:pointer}
.ck:checked{background:#228a5c;border-color:#228a5c}.ck:checked::after{content:"✓";color:#fff;font-size:14px;line-height:1}
.dw{overflow-x:auto;margin-top:22px}.dw th{padding:16px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}.dw td{padding:18px 12px;white-space:nowrap}
.hr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.hr h2{margin:2px 0 0}.hr .btn{padding:12px 22px}
.btn.pp{background:var(--sel);border-color:#5b45c9}
.sp{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.sel.pill select{border-radius:999px}
.cbx{position:relative}.pg .cbx input{cursor:pointer}.pg .cbx.open input{border-color:#6d4fe0;box-shadow:0 0 0 3px rgba(109,79,224,.28)}
.ddl{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:6;display:none;max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.cbx.open .ddl{display:block}.ddl div{padding:18px 20px;font-weight:600;cursor:pointer}.ddl div:hover{background:var(--sel)}
.btn.g:disabled{opacity:.55;cursor:not-allowed}
.gh{display:flex;align-items:center;gap:12px;margin-bottom:10px}.gh h2{margin:0}
.gi{width:44px;height:44px;border-radius:12px;border:1px solid var(--gold);background:rgba(212,167,58,.12);color:var(--gold);display:grid;place-items:center;flex:none}
.si{position:relative}.si svg{position:absolute;left:16px;top:15px;width:20px;height:20px;color:var(--muted)}.pg .si input{padding-left:48px}
.card .card{background:var(--inner);border-radius:22px;margin-bottom:12px}
.tp{border-top:4px solid #228a5c}.lf{border-left:4px solid #228a5c}
.badg{display:inline-flex;align-items:center;padding:10px 18px;border-radius:999px;background:rgba(34,138,92,.22);color:#3ddc97;font-weight:700}
.eg{color:#3ddc97;font-weight:700;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.hh{font-size:2rem;line-height:1.2;margin:0 0 8px}.bn{font-size:2.4rem;font-weight:800;margin:4px 0 10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.tab{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:12px;border:0;background:none;color:var(--text);font-weight:600;font-size:1.05rem;cursor:pointer}
.tab.on{background:rgba(34,138,92,.2);color:#3ddc97}
.lst>div{padding:18px 20px;border-top:1px solid var(--line)}.lst small{color:var(--muted);display:block}.lst b{font-size:1.9rem}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.tkb{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px}.tkb .t{word-break:break-all;margin-bottom:10px}
.cdx{background:var(--bg);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.cdx .h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.cdx pre{margin:0;padding:16px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.dw.box{border:1px solid var(--line);border-radius:18px;background:var(--inner)}
.sc{background:var(--inner);border:2px solid var(--line);border-radius:26px;padding:22px;margin-bottom:12px}.sc small{color:var(--muted);display:block;font-size:1.05rem}.sc b{font-size:2.6rem;display:block;line-height:1.3}
.bi svg{width:34px;height:34px}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.fl button{padding:12px 22px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:1.05rem;cursor:pointer}
.fl button.on{background:linear-gradient(135deg,#f0a93a,#7c3aed);border-color:transparent;color:#fff}
.nc{border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:14px;background:var(--inner)}
.nc.un{border-color:#6e5a2a;background:rgba(212,167,58,.07)}
.nc .ic2{width:48px;height:48px;border-radius:14px;background:var(--surface);display:grid;place-items:center;margin-bottom:16px}
.nc h3{margin:0 0 8px;font-size:1.25rem;display:flex;justify-content:space-between;align-items:center}
.nw{background:#7c3aed;color:#fff;font-size:.9rem;padding:6px 14px;border-radius:999px;font-weight:600}
.nc .mt{display:flex;justify-content:space-between;color:var(--muted);margin-top:14px}
.nc .ev{margin-top:14px;background:none;border:0;color:var(--muted);padding:0;cursor:pointer}
.chat{display:flex;flex-direction:column;min-height:560px}
.ch2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cm2{border:1px solid var(--line);border-radius:22px;padding:18px;background:var(--inner);margin:12px 0;max-width:92%}
.cm2 .w{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;align-items:baseline}.cm2 .w small{color:var(--muted)}
.sm{padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.pg textarea{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:14px 16px;font:inherit;outline:none}
.cin{display:flex;gap:12px;align-items:flex-end;border-top:1px solid var(--line);padding-top:16px;margin-top:auto}
.cin textarea{flex:1;height:84px;resize:none}
.pf label{color:var(--muted);font-size:.95rem}
.pf2{display:flex;gap:16px;align-items:center}.pf2 .gi{width:56px;height:56px;border-color:transparent;background:rgba(34,138,92,.2)}
.av{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#e8a840,#7c3aed);color:#fff;font-size:1.8rem;font-weight:800;display:grid;place-items:center;margin-bottom:12px}
.note{display:flex;gap:12px;padding:16px;border-radius:16px;border:1px solid #1f4a3d;background:rgba(34,138,92,.12);margin-bottom:16px}
.pg input:disabled,.pg select:disabled{opacity:.6}
.dl{padding:0;border-radius:36px;overflow:hidden}.dl .a{padding:28px 24px}.dl .b{padding:24px;background:var(--inner)}
.tile{width:74px;height:74px;border-radius:22px;background:#241a52;display:grid;place-items:center;color:#d4a73a;margin-bottom:18px}.tile svg{width:34px;height:34px}
.dl ol{padding-left:24px;line-height:2}
</style>
</head>

  <button class="ib" id="theme" aria-label="Theme" data-i="sun"></button>
  <button class="ib" aria-label="Chat" data-i="chat"></button>
  <button class="ib" aria-label="Notifications"><u data-i="bell"></u><span class="badge" style="display:none">0</span></button>

</script>
<style>#gate{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}#gate.on{display:flex}#gate .card{width:100%;max-width:420px;margin:0}#gate input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 16px;font:inherit;margin-bottom:12px}</style>
<div id="gate" class="on"><section class="card"><div class="eyebrow">MSI SMS Admin</div><h2 id="gt">Admin sign in</h2><form id="gf"><input id="gu" placeholder="Username" autocomplete="username" required><input id="gp" type="password" placeholder="Password (min 8 characters)" autocomplete="current-password" required><div id="gx" style="display:none"><input id="gn" placeholder="Full name"><input id="ge" type="email" placeholder="Email"></div><button class="btn g wide" type="submit" id="gb">Sign in</button><div class="msg" id="gm"></div></form><p class="muted" style="margin:14px 0 0;display:none" id="gs">No admin exists yet. <a href="#" id="gl" style="color:var(--blue)">Create the first admin</a></p></section></div>
<script>
(()=>{const M=window.MSI,g=q('#gate'),gm=q('#gm');let first=false,go=0,AG=[],CL=[],AD=[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={'Pending approval':'pending',Active:'active',Suspended:'suspended',Blocked:'blocked'};
const btn=(u,s,l)=>`<button class="sm" data-u="${u}" data-s="${s}" style="margin:2px">${l}</button>`;
const acts=x=>(x.status!=='active'?btn(x.uid,'active',x.status==='pending'?'Approve':'Activate'):'')+(x.status==='active'?btn(x.uid,'suspended','Suspend'):'')+(x.status!=='blocked'?btn(x.uid,'blocked','Block'):'');
const d=t=>t?new Date(t).toLocaleDateString():'—';
const fill=(id,rows,n,cols)=>{q(id+' tbody').innerHTML=rows.length?rows.join(''):`<tr><td colspan="${cols}" class="muted">Nothing found.</td></tr>`;q(id+' .pgn span').textContent='Showing '+(n?1:0)+' to '+rows.length+' of '+n+' entries - 1 / 1'};
const pc=document.createElement('section');pc.className='card';pc.innerHTML='<div class="eyebrow">Review</div><h2>Pending Applications</h2><p class="muted" style="margin:0 0 14px">New agents cannot sign in until you approve them.</p><div class="dw box"><table style="min-width:760px"><thead><tr><th>Username</th><th>Name</th><th>Email</th><th>WhatsApp</th><th>Country</th><th>Applied</th><th>Actions</th></tr></thead><tbody></tbody></table></div>';
q('#p-dash .card.hero').after(pc);
pc.onclick=e=>{const b=e.target.closest('[data-u]');if(b)M.setStatus(b.dataset.u,b.dataset.s).catch(x=>alert(x.message))};
const rAg=()=>{const pe=AG.filter(x=>x.status==='pending');pc.querySelector('tbody').innerHTML=pe.length?pe.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.whatsapp)}</td><td>${esc(x.country)}</td><td>${d(x.createdAt)}</td><td>${btn(x.uid,'active','Approve')}${btn(x.uid,'blocked','Reject')}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">No pending applications.</td></tr>';
 const s=q('#p-agents .f input').value.trim().toLowerCase(),st=ST[q('#p-agents select').value];
 const r=AG.filter(x=>(!s||[x.username,x.name,x.email].join(' ').toLowerCase().includes(s))&&(!st||x.status===st));
 fill('#p-agents',r.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${CL.filter(c=>c.agentId===x.uid).length}</td><td>0</td><td>${esc(x.status)}</td><td>—</td><td>${acts(x)}</td></tr>`),r.length,8);
 const k=document.querySelectorAll('#p-dash .stat strong');if(k[2])k[2].textContent=AG.filter(x=>x.status==='active').length;if(k[3])k[3].textContent=AG.filter(x=>x.status==='pending').length;
 const b=q('.badge'),n=AG.filter(x=>x.status==='pending').length;b.textContent=n;b.style.display=n?'':'none'};
const rCl=()=>{const f=document.querySelectorAll('#p-clients .f input'),s=f[0].value.trim().toLowerCase(),a=f[1].value.trim().toLowerCase(),st=q('#p-clients select').value;
 const nm=id=>(AG.find(x=>x.uid===id)||{}).username||'—';
 const r=CL.filter(x=>(!s||x.username.includes(s))&&(!a||nm(x.agentId).includes(a))&&(st==='All'||x.status===st.toLowerCase()));
 fill('#p-clients',r.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(nm(x.agentId))}</td><td>0</td><td>—</td><td>${esc(x.status)}</td><td>${d(x.createdAt)}</td><td>${x.status==='active'?btn(x.uid,'suspended','Suspend'):btn(x.uid,'active','Activate')}</td></tr>`),r.length,7);rAg()};
const rAd=()=>fill('#p-admins',AD.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.email)}</td><td>${esc(x.adminRole||'Admin')}</td><td>—</td><td>${esc(x.status)}</td><td>—</td><td></td></tr>`),AD.length,7);
const start=()=>{if(go)return;go=1;
 M.watch({role:'agent'},r=>{AG=r;rAg();rCl()});M.watch({role:'client'},r=>{CL=r;rCl()});M.watch({role:'admin'},r=>{AD=r;rAd()});
 ['#p-agents','#p-clients'].forEach(id=>{q(id+' .sb').onclick=id==='#p-agents'?rAg:rCl;q(id+' tbody').onclick=e=>{const b=e.target.closest('[data-u]');if(b)M.setStatus(b.dataset.u,b.dataset.s).catch(x=>alert(x.message))}});
 q('#p-agents form.af').onsubmit=async e=>{e.preventDefault();const f=e.target,v=[...f.querySelectorAll('input,select')].map(x=>x.value.trim()),m=f.querySelector('.msg');
  if(!v[0]||!v[1]||!v[2]||!v[3])return m.textContent='Please fill in the required fields.';m.textContent='Creating…';
  try{await M.createUser({username:v[0],password:v[1],name:v[2],email:v[3],whatsapp:v[4],country:v[5],role:'agent',status:ST[v[7]]||'active'});m.textContent='Agent "'+v[0].toLowerCase()+'" created.';f.reset()}catch(x){m.textContent=x.message}};
 q('#p-admins form.af').onsubmit=async e=>{e.preventDefault();const f=e.target,v=[...f.querySelectorAll('input:not([type=checkbox]),select')].map(x=>x.value.trim()),m=f.querySelector('.msg');
  if(!v[0]||!v[1]||!v[2])return m.textContent='Please fill in the required fields.';m.textContent='Creating…';
  try{await M.createUser({username:v[0],email:v[1],password:v[2],name:v[0],role:'admin',status:'active',extra:{adminRole:v[3]}});m.textContent='Admin "'+v[0].toLowerCase()+'" created.';f.reset()}catch(x){m.textContent=x.message}}};
q('[aria-label="Logout"]').onclick=()=>M.logout();
M.adminExists().then(x=>{q('#gs').style.display=x?'none':''}).catch(()=>{});
q('#gl').onclick=e=>{e.preventDefault();first=true;q('#gx').style.display='';q('#gb').textContent='Create admin & sign in';q('#gt').textContent='Create first admin'};
q('#gf').onsubmit=async e=>{e.preventDefault();gm.textContent=first?'Creating admin…':'Signing in…';
 try{if(first)await M.bootstrapAdmin({username:q('#gu').value.trim(),password:q('#gp').value,name:q('#gn').value.trim(),email:q('#ge').value.trim()});else await M.login(q('#gu').value.trim(),q('#gp').value)}catch(x){gm.textContent=x.message}};
M.listen(p=>{if(p&&p.role==='admin'&&p.status==='active'){g.classList.remove('on');q('.ttl span').textContent='Admin · '+p.username;start()}
 else{g.classList.add('on');if(p){gm.textContent='The signed-in account is not an admin. Sign in with an admin account.'}}});
setTimeout(()=>{if(M.me===undefined)g.classList.add('on')},500);
})();
</script>
</body>
</html>
